<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Matt Wave — interactive 3D</title>

  <!-- Google's <model-viewer> web component. Zero build, just one tag. -->
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    html, body { margin: 0; background: #0b0d12; color: #e6e8ee; font-family: system-ui, sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    .card {
      width: min(900px, 100%);
      background: #11141b;
      border: 1px solid #1f242e;
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
    p  { margin: 0 0 1rem; color: #9aa3b2; font-size: 0.95rem; }
    model-viewer {
      width: 100%;
      height: 520px;
      background: linear-gradient(180deg, #1b2030 0%, #0e1118 100%);
      border-radius: 10px;
    }
    code { background: #1a1e27; padding: 0.1rem 0.4rem; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Matt — interactive 3D (drag to rotate)</h1>
      <p>
        Click + drag to orbit. Scroll to zoom. The wave-pop animation plays on loop.
        This is the same <code>matt_wave.glb</code> from <code>exports/</code> — 233 KB,
        rendered live by your browser via Three.js.
      </p>

      <model-viewer
        src="../exports/matt_wave.glb"
        alt="3D model of the word Matt with a wave pop animation"
        camera-controls
        touch-action="pan-y"
        auto-rotate
        autoplay
        animation-name="*"
        exposure="1.1"
        shadow-intensity="0.8"
        environment-image="neutral"
        camera-orbit="-15deg 75deg 8m"
        min-camera-orbit="auto auto 4m"
        max-camera-orbit="auto auto 14m">
      </model-viewer>
    </div>
  </main>
</body>
</html>
