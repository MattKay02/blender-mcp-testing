<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Matt — interactive 3D logo</title>

  <!-- Google's <model-viewer> web component. Zero build, just one tag. -->
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    html, body { margin: 0; background: #0b0d12; color: #e6e8ee; font-family: system-ui, sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    .card {
      width: min(900px, 100%);
      background: #11141b;
      border: 1px solid #1f242e;
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
    p  { margin: 0 0 1rem; color: #9aa3b2; font-size: 0.95rem; }
    model-viewer {
      width: 100%;
      height: 520px;
      background: radial-gradient(ellipse at center, #1c2238 0%, #0a0d14 75%);
      border-radius: 10px;
    }
    .hint { font-size: 0.85rem; color: #6b7384; margin-top: 0.75rem; }
    code { background: #1a1e27; padding: 0.1rem 0.4rem; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Matt — interactive 3D logo</h1>
      <p>
        Drag to rotate, scroll to zoom. Rendered live by your browser via WebGL.
        Source file: <code>exports/matt_logo.glb</code> — ~30 KB.
      </p>

      <model-viewer
        src="../exports/matt_logo.glb"
        alt="Interactive 3D model of the word Matt in gold"
        camera-controls
        touch-action="pan-y"
        auto-rotate
        auto-rotate-delay="1500"
        rotation-per-second="20deg"
        interaction-prompt="none"
        exposure="1.0"
        shadow-intensity="1"
        shadow-softness="0.8"
        environment-image="neutral"
        camera-orbit="-25deg 75deg 7m"
        field-of-view="30deg"
        min-camera-orbit="auto auto 3m"
        max-camera-orbit="auto auto 14m">
        <div slot="poster" style="color:#9aa3b2;padding:1rem;">Loading 3D model...</div>
      </model-viewer>

      <p class="hint">
        Tip: same <code>.glb</code> file can drop into Three.js / React Three Fiber the same way.
      </p>
    </div>
  </main>
</body>
</html>
